# Storybook for the Scalar Design System — https://scalar-ds-storybook.netlify.app
# Deployed by hand from `main` (the site is not git-linked yet):
#   npm run build:storybook && netlify deploy --dir storybook-static --prod --site 13de78ca-4c06-4b1e-82c9-3476c834c7d7 --no-build

[build]
  command = "npm run build:storybook"
  publish = "storybook-static"

[build.environment]
  # Vite 8 and Vitest 5 need Node >= 22.12 (package.json `engines` still says >= 18).
  NODE_VERSION = "22"
  # Storybook's build does not need Playwright's browsers; they are only for `npm run test:stories`.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
