name: Auto-Sync Fork

on:
  schedule:
    - cron: '0 0/6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This grants the token permission to push changes
    steps:
      - name: Sync fork with upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync ${{ github.repository }} --branch main
